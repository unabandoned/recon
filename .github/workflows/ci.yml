name: ci

# recon's own tests. The suite is stdlib `unittest` and runs entirely offline
# against a fixture org, so it needs no token, no network and no npm — which is
# also what makes it fast enough to be worth running on every push.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  smoke:
    # Proves the real resolver still agrees with the real registry: resolve a
    # published tree with npm and cross-check every package's declared
    # dependencies against its packument (mechanism M2). This is the half of the
    # pipeline the offline suite deliberately fakes, so it earns its own job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Resolve a real tree and cross-check it
        run: python -m tests.smoke
