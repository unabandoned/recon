# Org-level ground truth — facts a human asserted that the build must reproduce.
#
# This file is hand-written and never generated. It does not violate "never
# record derivable state"; it inverts it. Nothing here is a cache of what the
# build found — it is underivable human knowledge used to AUDIT the derivation.
# If it drifts from reality the build fails, which is the opposite of the failure
# mode that rule protects against.
#
# Every fixture lives here, in the repo that does the deriving. Sibling-edge
# assertions used to live in each fork's own `.unabandoned.yml`, on the argument
# that a fact about one fork should be updated alongside the wiring it describes.
# True, and unaffordable: asserting the org's edge set that way is twenty-seven
# pull requests across twenty-seven repositories. Nobody opened the first one, so
# the check read an empty field and passed for its entire life. Here, an
# assertion costs one pull request, which is the only reason any get written.
#
# Adding one is the highest-leverage thing anyone can do to this repository.
# Every historical bug was caught by a human noticing a contradiction with
# something they already knew; each entry turns one such piece of knowledge from
# luck into machinery.
#
# Assert what you independently know, not what the build just told you. Pasting
# the derived edge list in here would make this a golden file — it would detect
# change, which M5 already does, while proving nothing about correctness.

# Wiring assertions: "this fork declares these siblings as direct dependencies".
# `declares` is about the fork's own package.json, not what ends up beneath it —
# a sibling reached through a third-party intermediary is not an edge. Bare names
# are scoped automatically.
edges:
  # The chain that broke the first version of the M2 edge check. browserify does
  # not declare detective; it declares module-deps, which declares detective. A
  # reader that conflates "reaches" with "declares" fails here forever, and no
  # wiring change can satisfy it.
  - fork: "@unabandoned/browserify"
    declares: ["@unabandoned/module-deps", "@unabandoned/crypto-browserify"]
  - fork: "@unabandoned/module-deps"
    declares: ["@unabandoned/detective"]

# Reachability assertions. `via` is the exact chain between the fork and the
# package, exclusive of both. Omit `via` to assert only that the path exists.
paths:
  # The fact the old flat-columns table hid: browserify does not consume
  # browserify-sign at all. It inherits readable-stream through the org's own
  # crypto-browserify fork — which is why fixing crypto-browserify closes
  # browserify with it, and why the queue ranks crypto-browserify first.
  - fork: "@unabandoned/browserify"
    package: readable-stream
    via: ["@unabandoned/crypto-browserify", "hash-base"]

# Counted assertions. `metric` is a field on a fork row; `subject` is its repo
# name. These are the direct machinery against the Renovate-dashboard miscount:
# a permanent floor of one under every repo contradicts any repo asserted to
# have zero.
counts: []
  # - metric: open_issues
  #   subject: xml-js
  #   equals: 1
